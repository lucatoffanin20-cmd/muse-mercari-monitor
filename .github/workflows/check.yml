name: Controlla nuovi annunci Muse su Mercari

on:
  workflow_dispatch:   # fatto scattare da cron-job.org ogni 5 minuti tramite l'API di GitHub
  schedule:
    - cron: "17 * * * *"   # riserva: una volta all'ora, nel caso cron-job.org sia giù

# non far partire due esecuzioni in contemporanea: se una è già in corso,
# la successiva aspetta in coda invece di girare in parallelo (evita che
# due run provino a salvare seen_items.json nello stesso momento)
concurrency:
  group: muse-mercari-monitor
  cancel-in-progress: false

permissions:
  contents: write   # serve per poter salvare seen_items.json nel repository

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il controllo
        run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva lo stato aggiornato nel repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiorna elenco annunci controllati"
          file_pattern: "seen_items.json last_check.txt"
